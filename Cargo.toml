[workspace]
resolver = "2"
members = [
    "crates/openlab-core",
    "crates/openlab-math",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OPEN-LAB Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-lab/openlab"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

